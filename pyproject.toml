[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "relayqueue"
version = "0.1.0"
description = "A small, durable webhook relay with signed ingestion, leased delivery, and observable retries."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "sqlalchemy>=2.0,<3", "httpx>=0.27,<1", "psycopg[binary]>=3.2,<4"]

[project.urls]
Repository = "https://github.com/Mzulhaq/relayqueue"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.9,<1", "build>=1.2,<2", "httpx2>=2,<3"]

[project.scripts]
relayqueue-worker = "relayqueue.worker:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
