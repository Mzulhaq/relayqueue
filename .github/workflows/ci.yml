name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.11'
            database: sqlite
          - python: '3.13'
            database: sqlite
          - python: '3.11'
            database: postgres
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: relayqueue
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: relayqueue_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U relayqueue -d relayqueue_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements.lock && python -m pip install --no-deps -e .
      - run: python -m ruff check . && python -m ruff format --check .
      - name: Tests with coverage
        env:
          TEST_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql+psycopg://relayqueue:ci-only-password@localhost:5432/relayqueue_test' || '' }}
        run: python -m pytest --cov=relayqueue --cov-report=term-missing
      - run: python scripts/demo.py
      - run: python -m build
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: docker build -t relayqueue:ci .
      - run: docker run --rm relayqueue:ci python scripts/demo.py
      - name: Compose startup with PostgreSQL
        env:
          RQ_INGRESS_SECRET: ci-ingress-placeholder-000000000000000
          RQ_DESTINATION_SECRET: ci-destination-placeholder-000000000000
          RQ_ADMIN_TOKEN: ci-admin-placeholder-0000000000000000
          RQ_DESTINATION_URL: https://example.invalid/webhook
        run: |
          docker compose config --quiet
          docker compose up --build --wait --wait-timeout 120
          curl --fail http://127.0.0.1:8000/ready
          docker compose exec -T worker python -c "from relayqueue.config import Settings; from relayqueue.storage import Database; print(Database(Settings.from_env().database_url).metrics())"
      - name: Compose logs
        if: failure()
        env:
          RQ_INGRESS_SECRET: ci-ingress-placeholder-000000000000000
          RQ_DESTINATION_SECRET: ci-destination-placeholder-000000000000
          RQ_ADMIN_TOKEN: ci-admin-placeholder-0000000000000000
          RQ_DESTINATION_URL: https://example.invalid/webhook
        run: docker compose logs --no-color
